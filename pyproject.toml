[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-cvlab"
version = "0.1.0"
description = "Reproducible drone detection experiment runner"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.6.0", "torchvision==0.21.0", "transformers==4.51.3",
  "numpy==2.2.5", "Pillow==11.2.1", "PyYAML==6.0.2",
  "pycocotools==2.0.8", "matplotlib==3.10.1", "timm==1.0.15", "scipy==1.15.2"
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.7"]

[project.scripts]
cvlab = "cvlab.cli:main"

[tool.setuptools.packages.find]
include = ["cvlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

