seed: 42
output: runs/rtdetr_queries_fold0
data:
  root: /kaggle/input/REPLACE_WITH_DATASET
  prepared: prepared
  split: fold
  fold: 0
  frame_step: 1
  horizontal_flip: 0.5
  ignore_policy: mask
model:
  name: rtdetr
  pretrained: true
  image_size: 960
  max_detections: 500
  score_threshold: 0.001
  weights: PekingU/rtdetr_r50vd
  num_queries: 700
  num_denoising: 100
  box_loss: giou
loader:
  batch_size: 2
  workers: 4
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: false
train:
  epochs: 20
  max_hours: 2
  lr: 0.0001
  backbone_lr_factor: 0.1
  weight_decay: 0.0001
  accumulation: 2
  clip_grad: 1.0
  max_batches_per_epoch: null
runtime:
  device: cuda
  precision: fp16
  cpu_threads: 4
  tf32: false
  deterministic: false
evaluation:
  max_detections:
  - 100
  - 500
  warmup_batches: 2
